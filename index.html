  <style>
    :root {
      --primary-color: #4f46e5; /* Default indigo-600 */
      --secondary-color: #6366f1; /* Default indigo-500 */
    }
    .qr-wrapper {
      position: relative;
      display: inline-block;
      padding: 1rem; /* Padding around the QR code */
      background-color: var(--qr-bg-color, #ffffff); /* Use CSS variable for background */
      border-radius: 0.75rem; /* Rounded corners for the wrapper */
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* Subtle shadow */
    }
    .qr-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 25%; /* Slightly smaller logo */
      height: 25%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      object-fit: contain; /* Ensure logo fits without stretching */
      background-color: #ffffff; /* White background for logo area */
      border-radius: 0.5rem; /* Rounded corners for logo */
      padding: 0.25rem; /* Small padding around logo */
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    }
    input[type="color"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 2.5rem; /* Standardize color input size */
      height: 2.5rem;
      background-color: transparent;
      border: none;
      cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 0.25rem;
    }
    input[type="color"]::-moz-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-moz-color-swatch {
      border: none;
      border-radius: 0.25rem;
    }
    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--secondary-color);
    }
    .text-primary {
      color: var(--primary-color);
    }
    .focus-ring-primary:focus {
      outline: none;
      box-shadow: 0 0 0 2px var(--primary-color);
    }

    /* Print and PDF Export Styles */
    @media print {
      body {
        background-color: #ffffff !important;
        padding: 0 !important;
      }
      header, footer, nav, .no-print, button {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      #app {
        max-width: 100% !important;
        box-shadow: none !important;
        border: none !important;
        min-height: auto !important;
      }
      .code-print-view {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
        font-size: 7.5pt !important;
        line-height: 1.25 !important;
        color: #111827 !important;
        white-space: pre-wrap !important;
        word-break: break-all !important;
      }
    }
    @media screen {
      .print-only {
        display: none !important;
      }
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>

    /**

     * @param {object} props

          type: 'color',
          value: value,

      );
    }

    /**
     * @param {object} props
     * @param {(transaction: Omit<Transaction, 'id' | 'timestamp' | 'ipAddress' | 'type' | 'country'>) => void} props.onTrackTransaction
     * @param {AppSettings} props.appSettings
     * @param {() => void} [props.onNavigateToSourceCode]
     */
    function QRCodeGenerator(props) {
      const { onTrackTransaction, appSettings, onNavigateToSourceCode } = props;
      const { brandLogoUrl, primaryColor, secondaryColor } = appSettings;

      const [email, setEmail] = useState('');
      const [phone, setPhone] = useState('');
      const [emailError, setEmailError] = useState('');
      const [phoneError, setPhoneError] = useState('');
      const [hasEnteredUserData, setHasEnteredUserData] = useState(false);

      const [qrContent, setQrContent] = useState('https://google.com');
      const [qrDataUrl, setQrDataUrl] = useState('');
      const [logoUrl, setLogoUrl] = useState(''); // User uploaded logo
      const [foregroundColor, setForegroundColor] = useState('#000000');
      const [backgroundColor, setBackgroundColor] = useState('#ffffff');
      const [contentError, setContentError] = useState('');

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const phoneRegex = /^[0-9\s\-\(\)\+]+$/; // Allows numbers, spaces, hyphens, parentheses, plus for international

      const validateEmail = (inputEmail) => {
        if (!inputEmail) return 'Email is required.';
        if (!emailRegex.test(inputEmail)) return 'Invalid email format.';
        return '';
      };

      const validatePhone = (inputPhone) => {
        if (!inputPhone) return 'Phone number is required.';
        if (!phoneRegex.test(inputPhone)) return 'Invalid phone number format.';
        return '';
      };

      const handleEmailChange = (e) => {
        const value = e.target.value;
        setEmail(value);
        setEmailError(validateEmail(value));
      };

      const handlePhoneChange = (e) => {
        const value = e.target.value;
        setPhone(value);
        setPhoneError(validatePhone(value));
      };

      const handleProceedToGenerator = () => {
        const emailErr = validateEmail(email);
        const phoneErr = validatePhone(phone);
        setEmailError(emailErr);
        setPhoneError(phoneErr);

        if (!emailErr && !phoneErr) {
          setHasEnteredUserData(true);
        }
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => setLogoUrl(reader.result);
        reader.readAsDataURL(file);
      };

      const debouncedSetQrContent = useCallback(
        debounce((value) => {
          setQrContent(value);
          if (!value) setContentError('QR content cannot be empty.');
          else setContentError('');
        }, 300),
        []
      );

      // Generate QR Automatically
      useEffect(() => {
        if (!qrContent) {
          setQrDataUrl('');
          return;
        }
        QRCode.toDataURL(qrContent, {
          margin: 2,
          width: 500,
          color: {
            dark: foregroundColor,
            light: backgroundColor
          }
        })
          .then(setQrDataUrl)
          .catch(err => {
            console.error("Error generating QR code:", err);
            setQrDataUrl('');
          });

          // Set custom CSS property for QR wrapper background
          document.documentElement.style.setProperty('--qr-bg-color', backgroundColor);

      }, [qrContent, foregroundColor, backgroundColor]);


      const downloadQRCode = useCallback(async (format) => {
        if (!qrDataUrl || !hasEnteredUserData || contentError) {
          alert('Please ensure valid user data and QR content are provided before downloading.');
          return;
        }

        if (format === 'png') {
          const link = document.createElement('a');
          link.download = `qr_${Date.now()}.png`;
          link.href = qrDataUrl;
          link.click();
        } else if (format === 'svg') {
          try {
            const svg = await QRCode.toString(qrContent, {
              type: 'svg',
              color: {
                dark: foregroundColor,
                light: backgroundColor
              }
            });
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `qr_${Date.now()}.svg`;
            a.click();

            URL.revokeObjectURL(url);
          } catch (error) {
            console.error("Error generating SVG:", error);
            alert("Failed to generate SVG. Please try again.");
          }
        }

        onTrackTransaction({ email, phone, qrContent, format });
      }, [qrDataUrl, qrContent, email, phone, hasEnteredUserData, onTrackTransaction, foregroundColor, backgroundColor, contentError]);

      return React.createElement('div', { className: 'p-6 md:p-10 flex flex-col items-center gap-8' },
        // User Data Input Section
        React.createElement('div', { className: 'w-full max-w-lg bg-white p-6 rounded-xl shadow-md border border-gray-200' }, 
          React.createElement('h2', { className: 'text-2xl font-bold text-gray-800 mb-6 text-center' }, hasEnteredUserData ? 'Your Details' : 'Enter Your Details to Proceed'),

          React.createElement('div', { className: 'mb-4' },
            React.createElement('label', { htmlFor: 'emailInput', className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Email Address'),
            React.createElement('input', {
              id: 'emailInput',
              type: 'email',
              value: email,
              onChange: handleEmailChange,
              disabled: hasEnteredUserData, // Disable if already entered
              className: `w-full p-3 border ${emailError ? 'border-red-500' : 'border-gray-300'} rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-900 disabled:opacity-70`,
              placeholder: 'your.email@example.com',
              'aria-invalid': !!emailError,
              'aria-describedby': emailError ? 'email-error' : null
            }),
            emailError && React.createElement('p', { id: 'email-error', className: 'mt-1 text-sm text-red-600' }, emailError)
          ),

          React.createElement('div', { className: 'mb-6' },
            React.createElement('label', { htmlFor: 'phoneInput', className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Phone Number'),
            React.createElement('input', {
              id: 'phoneInput',
              type: 'tel', // Changed to tel for semantic correctness
              value: phone,
              onChange: handlePhoneChange,
              disabled: hasEnteredUserData, // Disable if already entered
              className: `w-full p-3 border ${phoneError ? 'border-red-500' : 'border-gray-300'} rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-900 disabled:opacity-70`,
              placeholder: '+1 (555) 123-4567',
              'aria-invalid': !!phoneError,
              'aria-describedby': phoneError ? 'phone-error' : null
            }),
            phoneError && React.createElement('p', { id: 'phone-error', className: 'mt-1 text-sm text-red-600' }, phoneError)
          ),

          !hasEnteredUserData && React.createElement('button', { // Only show "Proceed" if not yet entered
            onClick: handleProceedToGenerator,
            disabled: !!emailError || !!phoneError || !email || !phone, // Disable if errors or empty
            className: `w-full font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus-ring-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed btn-primary`,
            style: { backgroundColor: primaryColor, '--tw-ring-color': primaryColor } // Dynamic primary color
          }, 'Proceed to Generator'),

          hasEnteredUserData && React.createElement('button', { // Add an "Edit Details" button
            onClick: () => setHasEnteredUserData(false), // Re-enable inputs
            className: 'w-full bg-gray-200 text-gray-700 font-semibold py-3 px-4 rounded-lg shadow-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-offset-2 transition-colors'
          }, 'Edit Details')
        ),

        // Main QR Generator Section
        // Changed to flex-col only to ensure vertical stacking
        React.createElement('div', { className: 'w-full max-w-xl flex flex-col items-center gap-8' },
          React.createElement('div', { className: 'w-full p-6 bg-gray-50 rounded-xl shadow-inner border border-gray-200' },

          React.createElement('div', { className: 'p-4 bg-white rounded-xl border border-gray-200 shadow-sm' },

        ),

        // Code Inspector Section
        React.createElement('div', { className: 'bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col' },

          React.createElement('div', { className: 'p-3 sm:p-4 bg-gray-50 border-b border-gray-200 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3' },

                }, fileName)

              }),
              React.createElement('button', {

          // Code lines container
          React.createElement('div', {

              ? filteredLines.map(item =>
                  React.createElement('div', { key: item.lineNum, className: 'flex hover:bg-gray-800/80 py-0.5 rounded px-1' },

        React.createElement('div', { id: 'printable-source', className: 'print-only p-4' },

    function App() {
      const [currentView, setCurrentView] = useState('generator'); // 'generator', 'sourceCode', 'admin', or 'forSale'
      /** @type {[Transaction[], function(Transaction[]): void]} */
      const [transactions, setTransactions] = useState([]);
      const DEFAULT_ADMIN_PASSWORD = "063247";
      const DEFAULT_APP_SETTINGS = {
        brandName: 'Dynamic QR Code Generator',
        brandLogoUrl: '', // Can be a default URL if desired
        primaryColor: '#4f46e5', // indigo-600
        secondaryColor: '#6366f1', // indigo-500
      };

      const [adminPassword, setAdminPassword] = useState(() => {
        try {
          const storedPassword = localStorage.getItem('adminPassword');
          return storedPassword || DEFAULT_ADMIN_PASSWORD;
        } catch (error) {
          console.error("Failed to load admin password from localStorage:", error);
          return DEFAULT_ADMIN_PASSWORD;
        }
      });
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [adminLoginError, setAdminLoginError] = useState('');

      /** @type {[AppSettings, function(AppSettings): void]} */
      const [appSettings, setAppSettings] = useState(() => {
        try {
          const storedSettings = localStorage.getItem('appSettings');
          return storedSettings ? JSON.parse(storedSettings) : DEFAULT_APP_SETTINGS;
        } catch (error) {
          console.error("Failed to load app settings from localStorage:", error);
          return DEFAULT_APP_SETTINGS;
        }
      });

      // Apply dynamic CSS variables on appSettings change
      useEffect(() => {
        document.documentElement.style.setProperty('--primary-color', appSettings.primaryColor);
        document.documentElement.style.setProperty('--secondary-color', appSettings.secondaryColor);
        document.title = appSettings.brandName + " - Admin Panel"; // Update title dynamically
      }, [appSettings]);


      // Load transactions from localStorage on initial render
      useEffect(() => {
        try {
          const storedTransactions = localStorage.getItem('qrTransactions');
          if (storedTransactions) {
            setTransactions(JSON.parse(storedTransactions));
          }
        } catch (error) {
          console.error("Failed to load transactions from localStorage:", error);
        }
      }, []);

      // Save transactions to localStorage whenever they change
      useEffect(() => {
        try {
          localStorage.setItem('qrTransactions', JSON.stringify(transactions));
        } catch (error) {
          console.error("Failed to save transactions to localStorage:", error);
        }
      }, [transactions]);

      // Save admin password to localStorage whenever it changes
      useEffect(() => {
        try {
          localStorage.setItem('adminPassword', adminPassword);
        } catch (error) {
          console.error("Failed to save admin password to localStorage:", error);
        }
      }, [adminPassword]);

      // Save app settings to localStorage whenever they change
      useEffect(() => {
        try {
          localStorage.setItem('appSettings', JSON.stringify(appSettings));
        } catch (error) {
          console.error("Failed to save app settings to localStorage:", error);
        }
      }, [appSettings]);


      /**
       * @param {Omit<Transaction, 'id' | 'timestamp' | 'ipAddress' | 'type' | 'country'>} newTransactionData
       */
      const handleTrackTransaction = useCallback((newTransactionData) => {
        const newTransaction = {
          ...newTransactionData,
          id: crypto.randomUUID(), // Generate a unique ID
          timestamp: Date.now(),
          type: 'qrGeneration', // Set type for QR generation
          ipAddress: 'N/A (Client-side)', // Placeholder for IP address on QR gen
          country: 'N/A (Client-side)', // Placeholder for country on QR gen
        };
        setTransactions((prevTransactions) => [...prevTransactions, newTransaction]);
      }, []);

      /**
       * @param {Omit<Transaction, 'id' | 'type'> & { ipAddress: string, country: string, timestamp: number, transactionId: string, status: 'pending' }} licenseTransactionData
       */
      const handleTrackLicensePurchase = useCallback((licenseTransactionData) => {
        const newTransaction = {
          ...licenseTransactionData,
          id: crypto.randomUUID(), // Ensure a unique ID for the admin panel
          type: 'licensePurchase', // Set type for license purchase
          // ipAddress, country, timestamp, transactionId, status are already in licenseTransactionData
        };
        setTransactions((prevTransactions) => [...prevTransactions, newTransaction]);
      }, []);

      /**
       * @param {string} id
       * @param {'approved' | 'denied'} newStatus
       */
      const handleUpdateLicenseStatus = useCallback((id, newStatus) => {
        setTransactions(prevTransactions =>
          prevTransactions.map(t =>
            t.id === id ? { ...t, status: newStatus } : t
          )
        );
      }, []);

      const handleClearTransactions = useCallback(() => {
        if (window.confirm('Are you sure you want to clear all transaction history? This action cannot be undone.')) {
          setTransactions([]);
        }
      }, []);

      const handleAdminLogin = useCallback((passwordAttempt) => {
        if (passwordAttempt === adminPassword) {
          setIsAdminLoggedIn(true);
          setAdminLoginError('');
        } else {
          setAdminLoginError('Incorrect password.');
          setIsAdminLoggedIn(false);
        }
      }, [adminPassword]);

      const handleAdminLogout = useCallback(() => {
        setIsAdminLoggedIn(false);
        setAdminLoginError('');
        // setCurrentView('generator'); // Optionally redirect to generator on logout
      }, []);

      const handleResetAdminPassword = useCallback(() => {
        if (window.confirm('This will reset the Admin password to the default "063247" and log you out. Are you sure?')) {
          setAdminPassword(DEFAULT_ADMIN_PASSWORD);
          setIsAdminLoggedIn(false);
          setAdminLoginError('');
          alert('Admin password has been reset to "063247".');
          // setCurrentView('generator'); // Optionally redirect to generator on reset
        }
      }, []);

      /**
       * @param {AppSettings} settings
       */
      const handleSaveAppSettings = useCallback((settings) => {
        setAppSettings(settings);
      }, []);


      return React.createElement(React.Fragment, null, // Use Fragment to allow header, main, and footer as siblings
        // Header / Navigation
        React.createElement('header', { className: 'bg-white shadow-sm p-4 border-b border-gray-200 w-full' },
          React.createElement('nav', { className: 'flex flex-col sm:flex-row sm:justify-between items-center gap-3 max-w-4xl mx-auto' },
            React.createElement('h1', { className: 'text-xl font-bold text-gray-800 tracking-tight' }, appSettings.brandName),
            React.createElement('div', { className: 'flex flex-wrap items-center gap-2' },
              React.createElement('button', {
                onClick: () => setCurrentView('generator'),
                className: `flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition-colors ${currentView === 'generator' ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-700 hover:bg-gray-100'}`
              },
                React.createElement(QrCodeIcon, { className: 'w-4 h-4' }),
                React.createElement('span', null, 'Generator')
              ),
              React.createElement('button', {
                onClick: () => setCurrentView('sourceCode'),
                className: `flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition-colors ${currentView === 'sourceCode' ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-700 hover:bg-gray-100'}`
              },
                React.createElement(DocumentTextIcon, { className: 'w-4 h-4' }),
                React.createElement('span', null, 'Source Code PDF')
              ),
              isAdminLoggedIn && React.createElement('button', { // Only visible if admin is logged in
                onClick: () => setCurrentView('admin'),
                className: `flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition-colors ${currentView === 'admin' ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-700 hover:bg-gray-100'}`
              },
                React.createElement(ChartBarIcon, { className: 'w-4 h-4' }),
                React.createElement('span', null, 'Admin Panel')
              )
            )
          )
        ),

        // Main Content Area
        React.createElement('main', { className: 'flex-1 p-4 sm:p-6 lg:p-8 w-full max-w-4xl mx-auto' }, // Ensure main takes remaining space
          currentView === 'generator'
            ? React.createElement(QRCodeGenerator, {
                onTrackTransaction: handleTrackTransaction,
                appSettings: appSettings,
                onNavigateToSourceCode: () => setCurrentView('sourceCode')
              })
            : currentView === 'sourceCode'
              ? React.createElement(SourceCodeExport, {
                  appSettings: appSettings,
                  onNavigateToGenerator: () => setCurrentView('generator')
                })
              : currentView === 'admin'
                ? (isAdminLoggedIn
                    ? React.createElement(AdminPanel, {
                        transactions: transactions,
                        onClearHistory: handleClearTransactions,
                        onUpdateLicenseStatus: handleUpdateLicenseStatus,
                        onLogout: handleAdminLogout,
                        onResetPassword: handleResetAdminPassword,
                        appSettings: appSettings,
                        onSaveAppSettings: handleSaveAppSettings // Pass save function
                      })
                    : React.createElement(AdminLogin, { onLogin: handleAdminLogin, onResetPassword: handleResetAdminPassword, error: adminLoginError, appSettings: appSettings })
                  )
                : React.createElement(ForSalePage, { onTrackLicensePurchase: handleTrackLicensePurchase, appSettings: appSettings })
        ),

        // Footer for Admin Panel access, Source Code export, For Sale page, and app info
        React.createElement('footer', { className: 'bg-white shadow-sm p-4 border-t border-gray-200 mt-auto w-full' },
          React.createElement('div', { className: 'flex flex-col sm:flex-row justify-between items-center max-w-4xl mx-auto text-sm text-gray-600 gap-2' },
            React.createElement('p', null, '© 2026 Dynamic QR Code Generator. https://www.mme-365.com | All rights reserved.'),
            React.createElement('div', { className: 'flex items-center gap-3' },
              React.createElement('button', {
                onClick: () => setCurrentView('sourceCode'),
                className: `flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition-colors text-indigo-600 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2`
              },
                React.createElement(DocumentTextIcon, { className: 'w-4 h-4' }),
                React.createElement('span', null, 'Source PDF')
              ),
              React.createElement('button', {
                onClick: () => setCurrentView('admin'),
                className: `flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition-colors text-gray-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2`
              },
                React.createElement(ChartBarIcon, { className: 'w-4 h-4' }),
                React.createElement('span', null, 'Admin Panel')
              ),
              React.createElement('button', {
                onClick: () => setCurrentView('forSale'),
                className: `flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition-colors text-gray-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2`
              },
                React.createElement('span', null, 'For Sale')
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(React.createElement(App));
  </script>
